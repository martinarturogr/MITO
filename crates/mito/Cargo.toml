[package]
name = "mito"
description = "MITO: My Integrated Terminal Orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
mito-catalog.workspace = true
mito-core.workspace = true
mito-desktop.workspace = true
mito-i18n.workspace = true
mito-engine.workspace = true
mito-terminal.workspace = true
mito-transfer.workspace = true
mito-tui.workspace = true
mito-mcp.workspace = true
mito-win.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
zeroize.workspace = true

[lib]
name = "mito"
path = "src/lib.rs"

# `mito.exe` es de consola; `mitow.exe` es el mismo código sin consola y es el destino
# de los accesos directos, «Abrir con» y los protocolos (ADR 0013).
[[bin]]
name = "mito"
path = "src/main.rs"

[[bin]]
name = "mitow"
path = "src/mitow.rs"

[lints]
workspace = true

[dev-dependencies]
assert_cmd.workspace = true
dunce.workspace = true
insta.workspace = true
predicates.workspace = true
zip.workspace = true
