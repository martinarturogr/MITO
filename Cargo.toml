[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/mito"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/martinarturogr/MITO"
publish = false

[workspace.dependencies]
# Crates internos (orden de capas: ver docs/adr/0002-workspace-y-capas.md)
mito-win = { path = "crates/mito-win" }
mito-core = { path = "crates/mito-core" }
mito-i18n = { path = "crates/mito-i18n" }
mito-transfer = { path = "crates/mito-transfer" }
mito-catalog = { path = "crates/mito-catalog" }
mito-engine = { path = "crates/mito-engine" }
mito-terminal = { path = "crates/mito-terminal" }
mito-tui = { path = "crates/mito-tui" }
mito-mcp = { path = "crates/mito-mcp" }

# Externos
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
dunce = "1.0.5"
junction = "2.1.0"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
uuid = { version = "1.29.3", features = ["v4"] }
windows = { version = "0.62.2", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

# Tests
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
